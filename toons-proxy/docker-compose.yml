version: "3.8"

services:
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    # Descomente a linha abaixo quando o serviço WireGuard estiver configurado
    # network_mode: "service:wireguard"
