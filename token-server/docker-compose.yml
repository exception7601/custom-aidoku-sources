version: '3.8'

services:
  token-server:
    build:
      context: .
    container_name: toonlivre-token-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - WG_AUTO_UP=${WG_AUTO_UP:-true}
    privileged: true
    cap_add:
      - NET_ADMIN
    volumes:
      - ./wireguard:/etc/wireguard
    networks:
      - token-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  token-network:
    driver: bridge
